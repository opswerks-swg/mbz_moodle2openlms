[project]
name = "mbz2openlms"
version = "0.1.0"
description = "Migrate Moodle course backups (.mbz) to OpenLMS (Open edX) and check the result."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "defusedxml>=0.7.1",
    "lxml>=5.3",
]

[project.scripts]
mbz2openlms = "mbz2openlms.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Synthetic Moodle XML: long data lines read better unwrapped.
"tests/fixtures/*" = ["E501"]
